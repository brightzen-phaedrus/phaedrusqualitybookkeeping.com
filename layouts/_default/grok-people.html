<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Params.summary | default .Description }}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #071726;
      --teal-300: #39d0c6;
      --sheet-green: #0b5d3b;
      --sheet-green-mid: #188038;
      --grid-line: #d7dce0;
      --col-header-bg: #f1f3f4;
      --col-header-text: #5f6368;
      --cell-text: #202124;
      --muted: #5f6368;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f9fa; color: var(--cell-text); font-family: "Roboto", Arial, sans-serif; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .site-header { background: rgba(7,23,38,0.97); border-bottom: 1px solid rgba(255,255,255,0.12); }
    .header-inner { max-width: min(1400px, calc(100vw - 40px)); margin: 0 auto; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .header-brand { color: #fff; font-family: "Manrope", sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.03em; }
    .header-brand span { color: var(--teal-300); }
    .header-note { color: rgba(255,255,255,0.55); font-size: 12px; }
    .sheet-chrome { max-width: min(1400px, calc(100vw - 24px)); margin: 18px auto 40px; background: #fff; border: 1px solid var(--grid-line); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(7,23,38,0.08); }
    .sheet-titlebar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px; }
    .sheet-icon { width: 26px; height: 34px; border-radius: 4px; background: var(--sheet-green-mid); flex-shrink: 0; }
    .sheet-name { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.03em; }
    .sheet-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .lede { padding: 4px 16px 12px; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 820px; }
    .grid-wrap { overflow-x: auto; }
    .page-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .page-body thead th { background: var(--col-header-bg); color: var(--col-header-text); font-weight: 500; text-align: left; padding: 8px 10px; border: 1px solid var(--grid-line); white-space: nowrap; }
    .page-body td { padding: 8px 10px; border: 1px solid var(--grid-line); vertical-align: top; }
    .page-body tbody tr:nth-child(even) td { background: #fafbfc; }
    .page-body p { padding: 0; margin: 0; }
    .site-footer { padding: 24px 0 32px; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="/grok/">Grok<span>.crew</span></a>
      <span class="header-note">Internal · Not a pipeline</span>
    </div>
  </header>
  <div class="sheet-chrome">
    <div class="sheet-titlebar">
      <div class="sheet-icon" aria-hidden="true"></div>
      <div>
        <div class="sheet-name">{{ .Params.heroTitle | default .Title }}</div>
        <div class="sheet-meta">{{ .Params.heroMeta | plainify }}</div>
      </div>
    </div>
    <div class="lede page-body">
      {{ .Content }}
    </div>
  </div>
  <footer class="site-footer">Grok · People book · noindex</footer>
</body>
</html>
