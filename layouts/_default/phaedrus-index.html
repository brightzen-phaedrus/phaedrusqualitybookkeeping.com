<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Params.summary | default .Description }}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-950: #071726;
      --navy-900: #0b1f33;
      --navy-800: #12324a;
      --blue-700: #146c94;
      --teal-500: #2a9d98;
      --teal-300: #39d0c6;
      --mist-100: #eaf4f6;
      --cloud-50: #f8fbfc;
      --slate-600: #526578;
      --white: #ffffff;
      --border: rgba(11, 31, 51, 0.14);
      --shell: min(1080px, calc(100vw - 40px));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--navy-900); background: var(--cloud-50);
      font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.6;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: "Manrope", sans-serif; letter-spacing: -0.045em; font-weight: 600; }

    .site-header {
      background: rgba(7, 23, 38, 0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .header-inner {
      max-width: var(--shell); margin: 0 auto;
      height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .header-brand { color: var(--white); font-family: "Manrope", sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }
    .header-brand span { color: var(--teal-300); }
    .header-note { color: rgba(255,255,255,0.55); font-size: 12px; }

    .page-main {
      flex: 1; max-width: var(--shell); margin: 0 auto; padding: 80px 20px;
      width: 100%;
    }
    .eyebrow {
      color: var(--teal-500); text-transform: uppercase; letter-spacing: 0.14em;
      font-size: 12px; font-weight: 700; margin-bottom: 16px;
    }
    .page-main h1 {
      font-size: clamp(36px, 5vw, 52px); line-height: 1.06; margin-bottom: 16px;
    }
    .page-lede {
      color: var(--slate-600); font-size: 18px; line-height: 1.55; margin-bottom: 48px;
      max-width: 600px;
    }

    .page-rows { display: flex; flex-direction: column; gap: 16px; }

    .page-row {
      display: grid; grid-template-columns: 52px minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 8px 28px; align-items: start;
      background: var(--white); border: 1px solid var(--border); border-radius: 14px;
      padding: 30px 34px; position: relative; overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    }
    .page-row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, var(--teal-300), var(--teal-500));
      opacity: 0; transition: opacity 0.18s;
    }
    .page-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 48px rgba(7, 23, 38, 0.1);
      border-color: rgba(42, 157, 152, 0.45);
    }
    .page-row:hover::before { opacity: 1; }

    .row-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--mist-100); font-size: 20px; margin-top: 2px;
    }
    .row-title {
      font: 600 21px/1.2 "Manrope", sans-serif; letter-spacing: -0.03em;
      color: var(--navy-900); margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .row-desc { color: var(--slate-600); font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
    .row-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--teal-500); font-weight: 700; font-size: 13.5px; transition: color 0.2s;
    }
    .row-link::after { content: "→"; }
    .page-row:hover .row-link { color: var(--teal-300); }

    .row-activity {
      border-left: 1px solid var(--border); padding-left: 28px; min-height: 100%;
    }
    .activity-label {
      color: var(--teal-500); text-transform: uppercase; letter-spacing: 0.12em;
      font-size: 10.5px; font-weight: 700; margin-bottom: 10px;
    }
    .row-activity ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .row-activity li {
      display: flex; gap: 10px; align-items: baseline;
      color: var(--navy-800); font-size: 13px; line-height: 1.5;
    }
    .act-date {
      flex-shrink: 0; font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 11px; font-weight: 600; color: var(--teal-500);
      background: var(--mist-100); border-radius: 6px; padding: 1px 7px; white-space: nowrap;
    }
    @media (max-width: 760px) {
      .page-row { grid-template-columns: 1fr; padding: 26px 24px; }
      .row-icon { margin-bottom: 4px; }
      .row-activity { border-left: none; padding-left: 0; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 4px; }
    }

    .card-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      margin-bottom: 16px;
    }
    .badge-live { background: #d1fae5; color: #065f46; }
    .badge-soon { background: #fef3c7; color: #92400e; }

    .site-footer {
      padding: 32px 0; text-align: center;
      background: var(--navy-950); color: rgba(255,255,255,0.45); font-size: 12px;
    }
    .site-footer a { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="/phaedrus/">🦉 Phaedrus</a>
      <span class="header-note">Internal · System Reference</span>
    </div>
  </header>

  <main class="page-main">
    <p class="eyebrow">System Reference</p>
    <h1>{{ .Params.heroTitle | default .Title }}</h1>
    <p class="page-lede">{{ .Params.heroLede | default "The ghost in the machine, documented." }}</p>

    {{ .Content }}
  </main>

  <footer class="site-footer">
    <p>🦉 Phaedrus · <a href="https://phaedrusqualitybookkeeping.com">Phaedrus Quality Bookkeeping</a></p>
  </footer>

</body>
</html>
